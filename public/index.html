<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Task Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f5;
      --surface: #ffffff;
      --ink: #14202e;
      --muted: #5a6778;
      --line: #d8dee7;
      --accent: #2747d8;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --pending: #8a5a00;
      --pending-bg: #fdf0d2;
      --progress: #1d4ed8;
      --progress-bg: #dde7ff;
      --done: #17623a;
      --done-bg: #d9f2e3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    h1 {
      margin: 0;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 12px 0 0;
      color: var(--muted);
    }

    form {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin: 40px 0 32px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
    }

    input, select, button { font: inherit; }

    input, select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    button {
      min-height: 42px;
      padding: 8px 18px;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #1d38b0; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    #message {
      min-height: 1.5em;
      margin: 0 0 12px;
      font-size: 0.9375rem;
    }
    #message.error { color: var(--danger); }
    #message.ok { color: var(--done); }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    li {
      display: grid;
      grid-template-columns: 1fr 150px auto;
      gap: 16px;
      align-items: center;
      padding: 16px 20px;
    }

    li + li { border-top: 1px solid var(--line); }

    .task-name { font-weight: 600; }

    .task-meta {
      margin-top: 2px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .status {
      min-height: 36px;
      font-weight: 500;
      border: 0;
      border-radius: 999px;
      padding: 4px 12px;
    }
    .status[data-status="Pending"] { background: var(--pending-bg); color: var(--pending); }
    .status[data-status="In Progress"] { background: var(--progress-bg); color: var(--progress); }
    .status[data-status="Completed"] { background: var(--done-bg); color: var(--done); }

    .remove {
      min-height: 36px;
      padding: 4px 12px;
      color: var(--danger);
      background: transparent;
      border: 1px solid var(--line);
    }
    .remove:hover { background: #fbe9e7; }

    .empty {
      display: block;
      padding: 32px 20px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 720px) {
      main { padding: 32px 16px 56px; }
      form { grid-template-columns: 1fr 1fr; }
      form label:first-of-type, form button { grid-column: 1 / -1; }
      li { grid-template-columns: 1fr auto; }
      li .status { grid-column: 1; justify-self: start; }
      li .remove { grid-row: 1; grid-column: 2; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Employee tasks</h1>
    <p class="summary" id="summary">Loading tasks…</p>

    <form id="task-form">
      <label>Task
        <input name="taskName" required maxlength="80" autocomplete="off">
      </label>
      <label>Assigned to
        <input name="assignedTo" required maxlength="60" autocomplete="off">
      </label>
      <label>Priority
        <select name="priority">
          <option>High</option>
          <option selected>Medium</option>
          <option>Low</option>
        </select>
      </label>
      <label>Status
        <select name="status">
          <option selected>Pending</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </label>
      <button type="submit">Add task</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <ul id="task-list"></ul>
  </main>

  <script>
    const API = "http://localhost:4000/tasks";
    const STATUSES = ["Pending", "In Progress", "Completed"];

    const list = document.getElementById("task-list");
    const summary = document.getElementById("summary");
    const message = document.getElementById("message");
    const form = document.getElementById("task-form");

    function say(text, kind) {
      message.textContent = text;
      message.className = kind || "";
    }

    async function request(url, options) {
      let response;
      try {
        response = await fetch(url, options);
      } catch {
        throw new Error("Can't reach the API. Start it with: node expressApp.js");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function render(tasks) {
      const open = tasks.filter((task) => task.status !== "Completed").length;
      summary.textContent = `${tasks.length} tasks, ${open} still open`;
      list.replaceChildren();

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No tasks yet. Add the first one above.";
        list.append(empty);
        return;
      }

      for (const task of tasks) {
        const item = document.createElement("li");

        const info = document.createElement("div");
        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.taskName;
        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent = `${task.assignedTo}, ${task.priority} priority`;
        info.append(name, meta);

        const status = document.createElement("select");
        status.className = "status";
        status.dataset.status = task.status;
        status.setAttribute("aria-label", `Status of ${task.taskName}`);
        for (const option of STATUSES) {
          const el = document.createElement("option");
          el.textContent = option;
          el.selected = option === task.status;
          status.append(el);
        }
        status.addEventListener("change", () => updateStatus(task, status.value));

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${task.taskName}`);
        remove.addEventListener("click", () => deleteTask(task));

        item.append(info, status, remove);
        list.append(item);
      }
    }

    async function load() {
      try {
        render(await request(API));
      } catch (error) {
        summary.textContent = "Tasks unavailable";
        list.replaceChildren();
        say(error.message, "error");
      }
    }

    async function updateStatus(task, status) {
      try {
        await request(`${API}/${task.id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...task, status }),
        });
        say(`Updated "${task.taskName}"`, "ok");
      } catch (error) {
        say(error.message, "error");
      }
      load();
    }

    async function deleteTask(task) {
      try {
        await request(`${API}/${task.id}`, { method: "DELETE" });
        say(`Deleted "${task.taskName}"`, "ok");
      } catch (error) {
        say(error.message, "error");
      }
      load();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(form));
      try {
        const result = await request(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        say(`Added "${result.task.taskName}"`, "ok");
        form.reset();
      } catch (error) {
        say(error.message, "error");
      }
      load();
    });

    load();
  </script>
</body>
</html>
